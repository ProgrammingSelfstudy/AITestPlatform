[package]
name = "mcp-device"
default-run = "mcp-device"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
device = { version = "0.1.0", path = "../device" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.191"
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
agent = { path = "../agent" }
rmcp = { version = "3.11.0", features = ["client", "transport-child-process"] }
