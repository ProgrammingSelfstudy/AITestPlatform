[package]
name = "agent"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.191"
mcp-device = { path = "../mcp-device" }
protocol = { version = "0.1.0", path = "../protocol" }
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "meta", "unicode-perl", "unicode-word-boundary"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "rt", "macros", "rt-multi-thread", "net"] }
tracing = "0.1.44"

[dev-dependencies]
device = { path = "../device" }
