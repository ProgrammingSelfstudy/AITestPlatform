[package]
name = "node"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
agent = { version = "0.1.0", path = "../agent" }
anyhow = "1.0.104"
device = { version = "0.1.0", path = "../device" }
futures-util = "0.3.34"
http-body = "1.1.0"
http-body-util = "0.1.5"
libc = "0.2.191"
protocol = { version = "0.1.0", path = "../protocol" }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util", "fs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
server = { path = "../server", features = ["test-support"] }
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "uuid", "json"] }
tokio = { version = "1.54.1", features = ["test-util"] }
